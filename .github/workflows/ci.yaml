name: CI

on: pull_request

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: straw-hat-team/github-actions-workflows/asdf/get-version@5ab906d801d41b723636b498e57509e18db1856a # v1.9.1
        id: opentofu-version
        with:
          plugin-name: opentofu
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ steps.opentofu-version.outputs.plugin-version }}
          tofu_wrapper: true
      - name: tofu fmt
        run: tofu fmt -check -recursive -diff
