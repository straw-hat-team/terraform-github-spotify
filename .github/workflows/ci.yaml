name: CI

on: pull_request

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: straw-hat-team/github-actions-workflows/asdf/get-version@5ab906d801d41b723636b498e57509e18db1856a # v1.9.1
        id: opentofu-version
        with:
          plugin-name: opentofu
      - uses: opentofu/setup-opentofu@000eeb8522f0572907c393e8151076c205fdba1b # v1.0.6
        with:
          tofu_version: ${{ steps.opentofu-version.outputs.plugin-version }}
          tofu_wrapper: true
      - name: tofu fmt
        run: tofu fmt -check -recursive -diff
